<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Create account — Identity Attack Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="auth">

<div class="auth-bg">
  <div class="auth-grid"></div>
  <div class="auth-glow auth-glow-tl"></div>
  <div class="auth-glow auth-glow-br"></div>
</div>

<div class="auth-main">
  <a href="/" class="auth-logo">
    <span class="auth-logo-dot"></span>
    <span>Identity Attack Graph</span>
  </a>

  <div class="auth-card">
    <div class="auth-brand-row">
      <span class="auth-mark"></span>
      <span class="auth-brand">Create account</span>
    </div>
    <p class="auth-sub">Your own profile, upload history, and settings.</p>

    <div class="auth-error" id="reg-error" hidden>
      <span class="auth-error-mark">!</span>
      <span id="reg-error-text">Something went wrong.</span>
    </div>

    <form method="POST" action="/register" class="auth-form" id="reg-form">
      <input type="hidden" name="next" id="reg-next" value="/app" />

      <label class="auth-field">
        <span class="auth-label">Email</span>
        <input type="email" name="email" autocomplete="email" autofocus
               required spellcheck="false" placeholder="you@example.com" />
      </label>

      <label class="auth-field">
        <span class="auth-label">Username</span>
        <input type="text" name="username" autocomplete="username" required
               spellcheck="false" autocapitalize="off" minlength="3"
               placeholder="at least 3 characters" />
      </label>

      <label class="auth-field">
        <span class="auth-label">Password</span>
        <input type="password" name="password" autocomplete="new-password"
               required minlength="8" placeholder="at least 8 characters" />
      </label>

      <button type="submit" class="auth-btn" id="reg-submit">
        <span class="auth-btn-label">Create account</span>
        <span class="auth-btn-arrow">→</span>
      </button>
    </form>

    <div class="auth-divider"><span>or</span></div>

    <p class="auth-alt">
      Already have an account?
      <a href="/login" id="login-link">Sign in</a>
    </p>
  </div>

  <p class="auth-footer">
    <a href="/">← Back to home</a>
  </p>
</div>

<script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const next = params.get("next");
    if (next && next.startsWith("/") && !next.startsWith("//")) {
      document.getElementById("reg-next").value = next;
      const ll = document.getElementById("login-link");
      ll.href = "/login?next=" + encodeURIComponent(next);
    }
    const errorMap = {
      "invalid_email": "Please enter a valid email address.",
      "invalid_username": "Username must be at least 3 characters.",
      "weak_password": "Password must be at least 8 characters.",
      "email_taken": "That email is already registered.",
      "username_taken": "That username is already taken.",
    };
    const code = params.get("error");
    if (code) {
      document.getElementById("reg-error-text").textContent =
        errorMap[code] || "Registration failed. Try again.";
      document.getElementById("reg-error").hidden = false;
    }
    const form = document.getElementById("reg-form");
    const btn = document.getElementById("reg-submit");
    form.addEventListener("submit", () => {
      btn.disabled = true;
      btn.querySelector(".auth-btn-label").textContent = "Creating…";
    });
  })();
</script>

</body>
</html>
