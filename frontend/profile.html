<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Profile — Identity Attack Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="profile-page">

<header>
  <h1>Identity Attack Graph</h1>
  <div class="controls">
    <a href="/app" class="nav-link">← Back to app</a>
    <button id="logout-btn">Sign out</button>
  </div>
</header>

<main class="profile-main">
  <section class="profile-header">
    <div class="profile-avatar" id="profile-initial">?</div>
    <div class="profile-meta">
      <h2 id="profile-username">…</h2>
      <p id="profile-email" class="muted">…</p>
      <p class="profile-dates" id="profile-dates"></p>
    </div>
  </section>

  <section class="profile-stats">
    <div class="stat-card">
      <div class="stat-value" id="stat-uploads">0</div>
      <div class="stat-label">Datasets uploaded</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-nodes">0</div>
      <div class="stat-label">Total nodes</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-edges">0</div>
      <div class="stat-label">Total relationships</div>
    </div>
  </section>

  <section class="profile-uploads">
    <h3 class="section-title">Upload history</h3>
    <div id="uploads-list"></div>
  </section>
</main>

<script>
  async function load() {
    const r = await fetch("/api/me/profile");
    if (r.status === 401) {
      window.location.href = "/login?next=" + encodeURIComponent("/profile");
      return;
    }
    if (!r.ok) {
      document.getElementById("profile-username").textContent = "Error loading profile";
      return;
    }
    const data = await r.json();
    render(data);
  }

  function render(data) {
    const u = data.user;
    const s = data.stats;

    document.getElementById("profile-initial").textContent =
      (u.username || "?").charAt(0).toUpperCase();
    document.getElementById("profile-username").textContent = u.username;
    document.getElementById("profile-email").textContent = u.email;

    const created = u.created_at ? new Date(u.created_at).toLocaleDateString() : "—";
    const last = u.last_login_at ? new Date(u.last_login_at).toLocaleString() : "—";
    document.getElementById("profile-dates").innerHTML =
      `Member since <strong>${created}</strong> · Last login <strong>${last}</strong>`;

    document.getElementById("stat-uploads").textContent = s.uploads;
    document.getElementById("stat-nodes").textContent = s.total_nodes.toLocaleString();
    document.getElementById("stat-edges").textContent = s.total_edges.toLocaleString();

    const list = document.getElementById("uploads-list");
    list.innerHTML = "";
    if (!data.uploads.length) {
      list.innerHTML = `<div class="empty-state">
        <p>You haven't uploaded any datasets yet.</p>
        <a href="/app?action=import" class="cta-primary">Upload your first dataset →</a>
      </div>`;
      return;
    }
    for (const up of data.uploads) {
      const card = document.createElement("div");
      card.className = "upload-row";
      const when = up.created_at ? new Date(up.created_at).toLocaleString() : "—";
      card.innerHTML = `
        <div class="upload-name">${escapeHtml(up.name)}</div>
        <div class="upload-meta">
          <span>${up.node_count || 0} nodes</span>
          <span>·</span>
          <span>${up.edge_count || 0} relationships</span>
          <span>·</span>
          <span class="muted">${escapeHtml(when)}</span>
        </div>`;
      list.appendChild(card);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  document.getElementById("logout-btn").onclick = async () => {
    await fetch("/api/auth/logout", { method: "POST" });
    window.location.href = "/";
  };

  load();
</script>

</body>
</html>
